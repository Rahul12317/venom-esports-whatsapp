<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Venom eSports - Battleground Arena</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Font: Orbitron & Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  
  <!-- FontAwesome for Gaming Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            venom: {
              green: '#22c55e',
              neon: '#39ff14',
              dark: '#0a0d0c',
              card: '#121714',
              border: '#1f2922'
            }
          },
          fontFamily: {
            gaming: ['Orbitron', 'sans-serif'],
            body: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-venom-dark text-gray-200 font-body min-h-screen flex flex-col justify-center items-center p-4 selection:bg-venom-neon selection:text-black">

  <!-- Glow Background Effect -->
  <div class="fixed top-1/4 -left-20 w-64 h-64 bg-venom-green/20 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="fixed bottom-1/4 -right-20 w-64 h-64 bg-venom-neon/15 rounded-full blur-[100px] pointer-events-none"></div>

  <!-- Main Container -->
  <main class="w-full max-w-md bg-venom-card border border-venom-border rounded-2xl p-6 md:p-8 shadow-2xl relative z-10 backdrop-blur-sm">
    
    <!-- Branding Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-venom-green/10 border border-venom-neon/30 mb-3 shadow-[0_0_15px_rgba(57,255,20,0.2)]">
        <i class="fa-solid fa-skull-crossbones text-venom-neon text-3xl"></i>
      </div>
      <h1 class="font-gaming text-2xl md:text-3xl font-black tracking-wider text-white uppercase">
        Venom <span class="text-venom-neon">eSports</span>
      </h1>
      <p class="text-xs md:text-sm text-gray-400 mt-1">Weekend BGMI Scrims & Tournaments</p>
    </div>

    <!-- Step A: Mobile Number Form -->
    <section id="phone-section" class="space-y-4">
      <div>
        <label for="phone-number" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">
          Mobile Number
        </label>
        <div class="relative flex items-center">
          <span class="absolute left-4 text-gray-500 font-bold text-sm select-none">+91</span>
          <input 
            type="tel" 
            id="phone-number" 
            maxlength="10" 
            placeholder="Enter 10-digit number" 
            class="w-full pl-14 pr-4 py-3.5 bg-black/60 border border-venom-border rounded-xl text-white placeholder-gray-600 focus:outline-none focus:border-venom-neon focus:ring-1 focus:ring-venom-neon transition duration-200 text-sm font-semibold tracking-wide"
          >
        </div>
      </div>

      <button 
        type="button" 
        id="send-otp-btn"
        onclick="requestWhatsAppOtp()" 
        class="w-full py-3.5 bg-venom-neon text-black font-gaming font-bold rounded-xl uppercase tracking-wider hover:bg-venom-green transition duration-200 shadow-[0_0_20px_rgba(57,255,20,0.3)] active:scale-[0.98] text-sm"
      >
        Get OTP via WhatsApp <i class="fa-brands fa-whatsapp ml-2 text-base"></i>
      </button>
    </section>

    <!-- Step B: OTP Verification Form (Hidden Initially) -->
    <section id="otp-section" class="hidden space-y-5">
      <div class="text-center">
        <p class="text-xs text-gray-400">OTP sent to WhatsApp for <span id="display-phone" class="text-venom-neon font-semibold"></span></p>
        <button onclick="backToPhone()" class="text-[11px] text-gray-500 hover:text-gray-300 underline mt-1">Change Number</button>
      </div>

      <!-- 6-Digit Box -->
      <div class="flex justify-between gap-2">
        <input type="text" maxlength="1" class="otp-box w-12 h-14 bg-black/60 border border-venom-border rounded-xl text-center text-xl font-gaming text-white focus:outline-none focus:border-venom-neon focus:ring-1 focus:ring-venom-neon">
        <input type="text" maxlength="1" class="otp-box w-12 h-14 bg-black/60 border border-venom-border rounded-xl text-center text-xl font-gaming text-white focus:outline-none focus:border-venom-neon focus:ring-1 focus:ring-venom-neon">
        <input type="text" maxlength="1" class="otp-box w-12 h-14 bg-black/60 border border-venom-border rounded-xl text-center text-xl font-gaming text-white focus:outline-none focus:border-venom-neon focus:ring-1 focus:ring-venom-neon">
        <input type="text" maxlength="1" class="otp-box w-12 h-14 bg-black/60 border border-venom-border rounded-xl text-center text-xl font-gaming text-white focus:outline-none focus:border-venom-neon focus:ring-1 focus:ring-venom-neon">
        <input type="text" maxlength="1" class="otp-box w-12 h-14 bg-black/60 border border-venom-border rounded-xl text-center text-xl font-gaming text-white focus:outline-none focus:border-venom-neon focus:ring-1 focus:ring-venom-neon">
        <input type="text" maxlength="1" class="otp-box w-12 h-14 bg-black/60 border border-venom-border rounded-xl text-center text-xl font-gaming text-white focus:outline-none focus:border-venom-neon focus:ring-1 focus:ring-venom-neon">
      </div>

      <button 
        type="button" 
        id="verify-otp-btn"
        onclick="verifyWhatsAppOtp()" 
        class="w-full py-3.5 bg-venom-neon text-black font-gaming font-bold rounded-xl uppercase tracking-wider hover:bg-venom-green transition duration-200 shadow-[0_0_20px_rgba(57,255,20,0.3)] active:scale-[0.98] text-sm"
      >
        Verify & Enter Arena
      </button>

      <div class="text-center">
        <button type="button" onclick="requestWhatsAppOtp()" class="text-xs text-gray-500 hover:text-venom-neon transition">
          Resend OTP
        </button>
      </div>
    </section>

    <!-- Footer Security Notice -->
    <div class="mt-8 pt-4 border-t border-venom-border/50 text-center">
      <p class="text-[11px] text-gray-500 flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-shield-halved text-venom-green"></i> 100% Fair Play & Anti-Cheat Monitored
      </p>
    </div>

  </main>

  <!-- Integrated Custom WhatsApp + Firestore Auth Logic with Admin Bypass & 2-Min Expiry -->
  <script type="module">
    import { auth, db, doc, getDoc, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "./firebase-config.js";

    let currentPhone = "";

    // --- ADMIN BYPASS CONFIG ---
    const ADMIN_PHONE = "9170980044"; 
    const MASTER_OTP = "082007";                 

    // 1. Request OTP via Railway WhatsApp Server (with Admin Bypass)
    window.requestWhatsAppOtp = async function() {
      const phoneInput = document.getElementById('phone-number').value.trim();
      const sendBtn = document.getElementById('send-otp-btn');

      if (phoneInput.length !== 10 || isNaN(phoneInput)) {
        alert('Please enter a valid 10-digit mobile number');
        return;
      }

      currentPhone = phoneInput;

      // Agar aap admin hain, toh WhatsApp API call skip ho jayegi
      if (currentPhone === ADMIN_PHONE) {
        document.getElementById('display-phone').innerText = "+91 " + currentPhone + " (Admin)";
        document.getElementById('phone-section').classList.add('hidden');
        document.getElementById('otp-section').classList.remove('hidden');
        return;
      }

      sendBtn.innerText = "Sending via WhatsApp...";
      sendBtn.disabled = true;

      try {
        const response = await fetch('https://whatsapp-otp-bot-production-98da.up.railway.app/send-otp', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ phone: currentPhone })
        });

        const data = await response.json();

        if (data.success) {
          document.getElementById('display-phone').innerText = "+91 " + currentPhone;
          document.getElementById('phone-section').classList.add('hidden');
          document.getElementById('otp-section').classList.remove('hidden');
        } else {
          alert('Server Error: ' + (data.message || 'Unknown error'));
        }
      } catch (error) {
        alert('Network Error while sending OTP: ' + error.message);
      } finally {
        sendBtn.innerHTML = 'Get OTP via WhatsApp <i class="fa-brands fa-whatsapp ml-2 text-base"></i>';
        sendBtn.disabled = false;
      }
    };

    window.backToPhone = function() {
      document.getElementById('otp-section').classList.add('hidden');
      document.getElementById('phone-section').classList.remove('hidden');
    };

    // 2. Verify OTP with Admin Bypass and 2-Minute Expiry Check
    window.verifyWhatsAppOtp = async function() {
      const otpInputs = document.querySelectorAll('.otp-box');
      const verifyBtn = document.getElementById('verify-otp-btn');
      let enteredOtp = "";
      otpInputs.forEach(input => enteredOtp += input.value.trim());

      if (enteredOtp.length !== 6) {
        alert('Please enter the complete 6-digit OTP!');
        return;
      }

      verifyBtn.innerText = "Verifying...";
      verifyBtn.disabled = true;

      try {
        // Admin Master OTP Bypass Check
        if (currentPhone === ADMIN_PHONE && enteredOtp === MASTER_OTP) {
          const dummyEmail = `${currentPhone}@venom.esports.com`;
          const dummyPassword = `Venom@${currentPhone}#2026`;

          try {
            await signInWithEmailAndPassword(auth, dummyEmail, dummyPassword);
          } catch (signupError) {
            await createUserWithEmailAndPassword(auth, dummyEmail, dummyPassword);
          }

          window.location.href = "dashboard.html";
          return;
        }

        // Normal Users: Firestore verification & 2-Minute Expiry Validation
        const otpDocRef = doc(db, "otps", currentPhone);
        const otpSnap = await getDoc(otpDocRef);

        if (!otpSnap.exists()) {
          alert('Invalid or expired OTP!');
          verifyBtn.innerText = "Verify & Enter Arena";
          verifyBtn.disabled = false;
          return;
        }

        const otpData = otpSnap.data();
        const currentTime = Date.now();

        // Check if OTP has expired (2 minutes = 120,000 ms)
        if (otpData.expiresAt && currentTime > otpData.expiresAt) {
          alert('OTP expired! Please request a new OTP.');
          verifyBtn.innerText = "Verify & Enter Arena";
          verifyBtn.disabled = false;
          return;
        }

        if (otpData.otp !== enteredOtp) {
          alert('Invalid or expired OTP!');
          verifyBtn.innerText = "Verify & Enter Arena";
          verifyBtn.disabled = false;
          return;
        }

        const dummyEmail = `${currentPhone}@venom.esports.com`;
        const dummyPassword = `Venom@${currentPhone}#2026`;

        try {
          await signInWithEmailAndPassword(auth, dummyEmail, dummyPassword);
        } catch (signupError) {
          if (signupError.code === 'auth/user-not-found' || signupError.code === 'auth/invalid-credential') {
            await createUserWithEmailAndPassword(auth, dummyEmail, dummyPassword);
          } else {
            throw signupError;
          }
        }

        window.location.href = "dashboard.html";

      } catch (error) {
        alert('Verification Error: ' + error.message);
        verifyBtn.innerText = "Verify & Enter Arena";
        verifyBtn.disabled = false;
      }
    };

    // OTP box auto focus next/previous navigation
    const otpBoxes = document.querySelectorAll('.otp-box');
    otpBoxes.forEach((box, index) => {
      box.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < otpBoxes.length - 1) {
          otpBoxes[index + 1].focus();
        }
      });
      box.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !box.value && index > 0) {
          otpBoxes[index - 1].focus();
        }
      });
    });
  </script>
</body>
</html>
